server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    # DNS interno de Docker para resolver rodo-api dinámicamente tras reinicios
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $rodo_api_upstream http://rodo-api:4000;

    # Compresión Gzip de alto rendimiento
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/manifest+json
        image/svg+xml;

    # Cabeceras de Seguridad Estándar + Content-Security-Policy (CSP) estricta para la SPA React
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' ws: wss: https://nominatim.openstreetmap.org https://router.project-osrm.org https://*.tile.openstreetmap.org https://server.arcgisonline.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

    # Proxy inverso hacia Backend API (Fastify)
    location /api/ {
        proxy_pass $rodo_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Proxy inverso para WebSockets en Tiempo Real (Socket.IO)
    location /socket.io/ {
        proxy_pass $rodo_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }

    # Proxy para archivos subidos (firmas, fotos de entrega, INE, comprobantes)
    location /uploads/ {
        proxy_pass $rodo_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires off;
        add_header Cache-Control "private, no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data: blob:; frame-ancestors 'self'; base-uri 'none'; form-action 'none'" always;
    }

    # Caché de activos estáticos compilados por Vite
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Dossier estático ejecutivo (usa Tailwind CDN y botón de impresión local)
    location = /presentacion_inversionista_rodo.html {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
        try_files $uri =404;
    }

    # Soporte SPA React Router / Vistas
    location / {
        try_files $uri $uri/ /index.html;
    }
}
