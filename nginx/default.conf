server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    # DNS interno de Docker para resolver rodo-api dinámicamente tras reinicios
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $rodo_api_upstream http://rodo-api:4000;

    # Compresión Gzip de alto rendimiento
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/manifest+json
        image/svg+xml;

    # Cabeceras de Seguridad Estándar
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy inverso hacia Backend API (Fastify)
    location /api/ {
        proxy_pass $rodo_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Proxy inverso para WebSockets en Tiempo Real (Socket.IO)
    location /socket.io/ {
        proxy_pass $rodo_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }

    # Proxy para archivos subidos (firmas, fotos de entrega, INE, comprobantes)
    location /uploads/ {
        proxy_pass $rodo_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires off;
        add_header Cache-Control "private, no-store" always;
    }

    # Caché de activos estáticos compilados por Vite
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Soporte SPA React Router / Vistas
    location / {
        try_files $uri $uri/ /index.html;
    }
}
